services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AIVS_STORAGE_BACKEND: ${AIVS_STORAGE_BACKEND:-filesystem}
      AIVS_STORAGE_ROOT: /data/.aivs
      AIVS_REDIS_URL: ${AIVS_REDIS_URL:-redis://redis:6379/0}
      AIVS_REDIS_NAMESPACE: ${AIVS_REDIS_NAMESPACE:-aivs}
      AIVS_POSTGRES_DSN: ${AIVS_POSTGRES_DSN:-postgresql://aivs:aivs-dev-only@postgres:5432/aivs}
      AIVS_CATALOG_BACKEND: ${AIVS_CATALOG_BACKEND:-}
      AIVS_APPROVAL_BACKEND: ${AIVS_APPROVAL_BACKEND:-}
      AIVS_AUDIT_BACKEND: ${AIVS_AUDIT_BACKEND:-}
      AIVS_EXTERNAL_PUBLISH_ENABLED: ${AIVS_EXTERNAL_PUBLISH_ENABLED:-false}
      AIVS_ARTIFACT_BACKEND: ${AIVS_ARTIFACT_BACKEND:-filesystem}
      AIVS_S3_ENDPOINT_URL: ${AIVS_S3_ENDPOINT_URL:-}
      AIVS_S3_BUCKET: ${AIVS_S3_BUCKET:-aivs}
      AIVS_S3_ACCESS_KEY_ID: ${AIVS_S3_ACCESS_KEY_ID:-}
      AIVS_S3_SECRET_ACCESS_KEY: ${AIVS_S3_SECRET_ACCESS_KEY:-}
      AIVS_S3_REGION: ${AIVS_S3_REGION:-us-east-1}
      AIVS_S3_PREFIX: ${AIVS_S3_PREFIX:-aivs}
      AIVS_API_KEY: ${AIVS_API_KEY:-}
      AIVS_RATE_LIMIT_PER_MINUTE: ${AIVS_RATE_LIMIT_PER_MINUTE:-120}
      AIVS_RATE_LIMIT_WINDOW_SECONDS: ${AIVS_RATE_LIMIT_WINDOW_SECONDS:-60}
      AIVS_LLM_BASE_URL: ${AIVS_LLM_BASE_URL:-}
      AIVS_LLM_API_KEY: ${AIVS_LLM_API_KEY:-}
      AIVS_LLM_MODEL: ${AIVS_LLM_MODEL:-}
      AIVS_TTS_BASE_URL: ${AIVS_TTS_BASE_URL:-}
      AIVS_TTS_API_KEY: ${AIVS_TTS_API_KEY:-}
      AIVS_TTS_MODEL: ${AIVS_TTS_MODEL:-}
      AIVS_VIDEO_PROVIDER: ${AIVS_VIDEO_PROVIDER:-}
      AIVS_VIDEO_BASE_URL: ${AIVS_VIDEO_BASE_URL:-}
      AIVS_VIDEO_API_KEY: ${AIVS_VIDEO_API_KEY:-}
      AIVS_VIDEO_MODEL: ${AIVS_VIDEO_MODEL:-}
      AIVS_VIDEO_SUBMIT_PATH: ${AIVS_VIDEO_SUBMIT_PATH:-/videos/generations}
      AIVS_VIDEO_POLL_PATH: ${AIVS_VIDEO_POLL_PATH:-/videos/{job_id}}
      AIVS_VIDEO_ALLOWED_DOWNLOAD_HOSTS: ${AIVS_VIDEO_ALLOWED_DOWNLOAD_HOSTS:-}
    volumes:
      - aivs_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["aivs-worker", "--storage-root", "/data/.aivs"]
    environment:
      AIVS_STORAGE_BACKEND: ${AIVS_STORAGE_BACKEND:-filesystem}
      AIVS_STORAGE_ROOT: /data/.aivs
      AIVS_REDIS_URL: ${AIVS_REDIS_URL:-redis://redis:6379/0}
      AIVS_REDIS_NAMESPACE: ${AIVS_REDIS_NAMESPACE:-aivs}
      AIVS_POSTGRES_DSN: ${AIVS_POSTGRES_DSN:-postgresql://aivs:aivs-dev-only@postgres:5432/aivs}
      AIVS_CATALOG_BACKEND: ${AIVS_CATALOG_BACKEND:-}
      AIVS_APPROVAL_BACKEND: ${AIVS_APPROVAL_BACKEND:-}
      AIVS_AUDIT_BACKEND: ${AIVS_AUDIT_BACKEND:-}
      AIVS_EXTERNAL_PUBLISH_ENABLED: ${AIVS_EXTERNAL_PUBLISH_ENABLED:-false}
      AIVS_ARTIFACT_BACKEND: ${AIVS_ARTIFACT_BACKEND:-filesystem}
      AIVS_S3_ENDPOINT_URL: ${AIVS_S3_ENDPOINT_URL:-}
      AIVS_S3_BUCKET: ${AIVS_S3_BUCKET:-aivs}
      AIVS_S3_ACCESS_KEY_ID: ${AIVS_S3_ACCESS_KEY_ID:-}
      AIVS_S3_SECRET_ACCESS_KEY: ${AIVS_S3_SECRET_ACCESS_KEY:-}
      AIVS_S3_REGION: ${AIVS_S3_REGION:-us-east-1}
      AIVS_S3_PREFIX: ${AIVS_S3_PREFIX:-aivs}
      AIVS_LLM_BASE_URL: ${AIVS_LLM_BASE_URL:-}
      AIVS_LLM_API_KEY: ${AIVS_LLM_API_KEY:-}
      AIVS_LLM_MODEL: ${AIVS_LLM_MODEL:-}
      AIVS_TTS_BASE_URL: ${AIVS_TTS_BASE_URL:-}
      AIVS_TTS_API_KEY: ${AIVS_TTS_API_KEY:-}
      AIVS_TTS_MODEL: ${AIVS_TTS_MODEL:-}
      AIVS_VIDEO_PROVIDER: ${AIVS_VIDEO_PROVIDER:-}
      AIVS_VIDEO_BASE_URL: ${AIVS_VIDEO_BASE_URL:-}
      AIVS_VIDEO_API_KEY: ${AIVS_VIDEO_API_KEY:-}
      AIVS_VIDEO_MODEL: ${AIVS_VIDEO_MODEL:-}
      AIVS_VIDEO_SUBMIT_PATH: ${AIVS_VIDEO_SUBMIT_PATH:-/videos/generations}
      AIVS_VIDEO_POLL_PATH: ${AIVS_VIDEO_POLL_PATH:-/videos/{job_id}}
      AIVS_VIDEO_ALLOWED_DOWNLOAD_HOSTS: ${AIVS_VIDEO_ALLOWED_DOWNLOAD_HOSTS:-}
    volumes:
      - aivs_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AIVS_POSTGRES_USER:-aivs}
      POSTGRES_PASSWORD: ${AIVS_POSTGRES_PASSWORD:-aivs-dev-only}
      POSTGRES_DB: ${AIVS_POSTGRES_DB:-aivs}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  aivs_data:
  redis_data:
  postgres_data:
