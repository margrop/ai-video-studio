name: Article to Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Article topic or title"
        required: true
        type: string
      source_path:
        description: "Optional Markdown path inside the repository"
        required: false
        default: ""
        type: string
      duration:
        description: "Target duration in seconds"
        required: true
        default: "60"
        type: string
      use_ai:
        description: "Use the server-configured OpenAI-compatible planner"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOPIC: ${{ inputs.topic }}
      SOURCE_PATH: ${{ inputs.source_path }}
      DURATION: ${{ inputs.duration }}
      USE_AI: ${{ inputs.use_ai }}
      AIVS_LLM_BASE_URL: ${{ secrets.AIVS_LLM_BASE_URL }}
      AIVS_LLM_API_KEY: ${{ secrets.AIVS_LLM_API_KEY }}
      AIVS_LLM_MODEL: ${{ secrets.AIVS_LLM_MODEL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install AI Video Studio
        run: python -m pip install .
      - name: Validate source path
        if: ${{ inputs.source_path != '' }}
        run: |
          python - "$SOURCE_PATH" <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          source = (root / sys.argv[1]).resolve()
          if root not in source.parents or not source.is_file():
              raise SystemExit("source_path must point to a Markdown file inside the repository")
          if source.suffix.lower() not in {".md", ".markdown"}:
              raise SystemExit("source_path must use .md or .markdown")
          PY
      - name: Generate content package
        run: |
          set -euo pipefail
          mkdir -p artifacts/article-video
          SOURCE_ARGS=()
          if [[ -n "$SOURCE_PATH" ]]; then SOURCE_ARGS+=(--source "$SOURCE_PATH"); fi
          AI_ARGS=()
          if [[ "$USE_AI" != "true" ]]; then AI_ARGS+=(--no-ai); fi
          aivs generate "$TOPIC" "${SOURCE_ARGS[@]}" "${AI_ARGS[@]}" \
            --duration "$DURATION" \
            --output artifacts/article-video/video.mp4
          cp artifacts/article-video/.video-aivs/story-plan.json artifacts/article-video/
          cp artifacts/article-video/.video-aivs/subtitles.srt artifacts/article-video/
          cp artifacts/article-video/.video-aivs/narration.wav artifacts/article-video/
          cp artifacts/article-video/.video-aivs/social-drafts.json artifacts/article-video/
      - name: Upload content package
        uses: actions/upload-artifact@v4
        with:
          name: aivs-article-video-${{ github.run_id }}
          path: artifacts/article-video
          if-no-files-found: error
